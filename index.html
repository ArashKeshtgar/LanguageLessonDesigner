<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="English lessons for working in Canada and the US: collocations, grammar, daily spaced-repetition review and Persian proverbs with their American equivalents." />
    <!-- Home-screen app. english.<domain> is the English app; ctx.<domain> (the
         owner's private Context reader) swaps in its own name, icon and manifest
         below. There the manifest sits behind basic auth, hence use-credentials. -->
    <link id="manifest" rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <link id="touch-icon" rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta id="app-title" name="apple-mobile-web-app-title" content="English" />
    <meta id="theme" name="theme-color" content="#1f4d3a" />
    <title>English Lessons · درس‌های انگلیسی</title>
    <script>
      if (location.hostname.startsWith('ctx.')) {
        document.getElementById('manifest').href = '/manifest-ctx.json'
        document.getElementById('touch-icon').href = '/ctx-apple-touch-icon.png'
        document.getElementById('app-title').content = 'Context'
        document.getElementById('theme').content = '#22303d'
        document.title = 'Context'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
